name: Test package and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[docs]' build
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python examples/time_dependent.py
      - run: python examples/alternating.py
      - run: python examples/from_csv.py
      - run: python tools/recompute_multiplier.py
      - run: python tools/build_docs.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0
      - run: python tools/build_paper.py
      - run: test -s paper/paper.pdf
